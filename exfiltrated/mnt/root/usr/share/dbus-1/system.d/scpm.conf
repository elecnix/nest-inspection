<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
    <policy user="root">
        <allow own="com.nestlabs.scpm.sleepd"/>
        <allow own="com.nestlabs.scpm.shutdownd"/>
        <allow send_destination="com.nestlabs.scpm.sleepd"/>
        <allow send_destination="com.nestlabs.scpm.shutdownd"/>
        <allow send_interface="com.nestlabs.scpm.sleep_client"/>
        <allow send_interface="com.nestlabs.scpm.sleep_manager"/>
        <allow send_interface="com.nestlabs.scpm.shutdown_client"/>
        <allow send_interface="com.nestlabs.scpm.shutdown_manager"/>
        <allow send_interface="com.nestlabs.scpm.debug"/>
        <allow send_interface="com.nestlabs.czsniffer.main"/>
    </policy>
</busconfig>
