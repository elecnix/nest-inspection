[package]
name = "nest-mqtt"
version = "0.1.0"
edition = "2021"
authors = ["Nicolas <nicolas@example.com>"]
description = "MQTT interface for Nest Learning Thermostat via backplate protocol"

[[bin]]
name = "nest-mqtt"
path = "src/main.rs"

[[bin]]
name = "nest-test"
path = "src/test_suite.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serialport = { version = "4.3", default-features = false }
rumqttc = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
crc = "3.0"
bytes = "1.5"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
